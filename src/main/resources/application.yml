spring:
  application:
    name: learning-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: LearningPlatformScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: 5
      org.quartz.jobStore.class: org.quartz.impl.jdbcjobstore.JobStoreTX
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: false
      org.quartz.jobStore.dataSource: quartzDS
      org.quartz.dataSource.quartzDS.provider: hikaricp
      org.quartz.dataSource.quartzDS.driver: org.postgresql.Driver
      org.quartz.dataSource.quartzDS.URL: ${DB_URL:jdbc:postgresql://localhost:5432/learning_platform}
      org.quartz.dataSource.quartzDS.user: ${DB_USERNAME:postgres}
      org.quartz.dataSource.quartzDS.password: ${DB_PASSWORD:postgres}
      org.quartz.dataSource.quartzDS.maxConnections: 5

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:claude-sonnet-4-6}
          temperature: 0.7
          max-tokens: 500

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-secret-in-production-min-32-chars}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  teams:
    default-webhook-url: ${TEAMS_DEFAULT_WEBHOOK_URL:}
    connect-timeout-seconds: 10
    read-timeout-seconds: 15
  ai:
    tip-prompt-template: |
      You are an IT learning assistant helping professionals grow their skills.
      Generate a practical, concise tip about the following topic: "{topic}".
      Topic description: "{description}"
      Difficulty level: {difficulty}
      Tags: {tags}

      Format your response as follows:
      **Title**: [A catchy title for the tip]
      **Summary**: [One sentence summary]
      **Details**:
      - [Point 1]
      - [Point 2]
      - [Point 3]
      **Example**: [A brief practical example]
      **Pro Tip**: [One advanced insight]

      Keep it concise, practical and relevant for IT professionals.
